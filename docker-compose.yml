services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chordweaver
      POSTGRES_USER: chordweaver
      POSTGRES_PASSWORD: chordweaver
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chordweaver"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://chordweaver:chordweaver@db:5432/chordweaver
      SECRET_KEY: local-docker-secret
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
