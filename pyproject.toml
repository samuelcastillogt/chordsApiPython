[project]
name = "chordweaver-api"
version = "0.4.0"
description = "ChordWeaver API: explains why a chord progression works and suggests what comes next."
readme = "README.md"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (tests/test_core/test_packaging.py checks it): Vercel installs
# from this file, Docker and CI from requirements.txt.
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-jose[cryptography]==3.5.0",
    "google-cloud-firestore==2.34.0",
    "sentry-sdk[fastapi]==2.71.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = [
    "E501",    # Long lines are left to the formatter.
    "RUF001",  # Spanish text and music symbols (♭, ♯, →) are intentional.
    "RUF002",
    "RUF003",
    "B008",    # FastAPI's Depends() in defaults is the documented pattern.
    "UP042",   # Note/ChordType stay (str, Enum): StrEnum would change str() of members.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
